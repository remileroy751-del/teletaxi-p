name: Build APK

# Se déclenche automatiquement à chaque envoi de code sur la branche main,
# et peut aussi être lancé manuellement depuis l'onglet "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK (version debug, installable directement)
        run: gradle assembleDebug --no-daemon

      - name: Mettre l'APK à disposition en téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: TeleTaxiPlanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
